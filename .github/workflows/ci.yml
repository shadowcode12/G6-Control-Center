name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Tests
        run: pytest -q
      - name: UI import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from app.ui.pages import GPUPage, PerformancePage; from app.main import MainWindow"