name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile
        run: python -m compileall -q app
      - name: Tests
        run: pytest -q
      - name: Import smoke test
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -c "from app.ui.pages import GPUPage; from app.backend.performance import PerformanceController"